<style>
/* Login: eine einzelne Haltestelle vor der Strecke */
:root{
  --paper:#f2f4f8; --card:#ffffff; --ink:#1b2140; --muted:#59617d; --rule:#d6dbe7;
  --l-job:#3b3fa0; --l-edu:#0d8577; --l-eng:#c97a12; --go:#23955a; --bad:#b3261e;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f1222; --card:#171b31; --ink:#e6e8f3; --muted:#9aa1bd; --rule:#2a3050;
  --l-job:#8d92ff; --l-edu:#35c2b0; --l-eng:#f0a640; --go:#4fd38a; --bad:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;-webkit-text-size-adjust:100%}
main{width:100%;max-width:440px;justify-self:center;min-width:0}
.lines{display:grid;gap:7px;margin-bottom:34px}
.lines i{display:block;height:6px;border-radius:3px;background:var(--c);transform-origin:left;animation:draw .9s cubic-bezier(.3,.7,.2,1) both}
.lines i:nth-child(1){--c:var(--l-job);width:72%}
.lines i:nth-child(2){--c:var(--l-edu);width:100%;animation-delay:.08s}
.lines i:nth-child(3){--c:var(--l-eng);width:46%;animation-delay:.16s}
@keyframes draw{from{transform:scaleX(0)}}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(52px,14vw,76px);line-height:.9;text-transform:uppercase;letter-spacing:.005em}
.role{margin:14px 0 30px;color:var(--muted);max-width:34ch}
form{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:22px}
label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink)}
input:focus{outline:none;border-color:var(--l-job);box-shadow:0 0 0 3px color-mix(in srgb,var(--l-job) 22%,transparent)}
input[aria-invalid="true"]{border-color:var(--bad)}
.show{font:inherit;font-size:13px;padding:0 12px;border-radius:10px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}
button.go{margin-top:14px;width:100%;font:inherit;font-weight:600;font-size:16px;padding:13px 16px;border-radius:10px;border:0;background:var(--ink);color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
button.go:disabled{opacity:.7;cursor:progress}
button.go .dot{width:9px;height:9px;border-radius:50%;background:var(--go)}
:focus-visible{outline:2px solid var(--l-job);outline-offset:3px}
.msg{min-height:1.5em;margin:10px 0 0;font-size:14px;color:var(--bad)}
.help{margin-top:22px;font-size:14px;color:var(--muted)}
.help a{color:var(--ink);text-underline-offset:3px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
(()=>{
  const P=JSON.parse(document.getElementById("payload").textContent);
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const salt=b64(P.salt),iv=b64(P.iv),ct=b64(P.ct);
  const KEY="ds-portfolio-key-"+P.v;
  const f=document.getElementById("f"),pw=document.getElementById("pw"),msg=document.getElementById("msg"),go=document.getElementById("go"),goT=document.getElementById("go-t");

  async function derive(p){
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
  }
  async function open(key){
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
    try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));sessionStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(e){}
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }
  // Im selben Tab angemeldet: direkt öffnen
  (async()=>{
    let s=null;try{s=sessionStorage.getItem(KEY)}catch(e){}
    if(!s)return;
    try{const key=await crypto.subtle.importKey("raw",b64(s),{name:"AES-GCM"},true,["decrypt"]);await open(key)}
    catch(e){try{sessionStorage.removeItem(KEY)}catch(_){}}
  })();

  document.getElementById("show").addEventListener("click",e=>{
    const on=pw.type==="password";pw.type=on?"text":"password";
    e.currentTarget.textContent=on?"Verbergen":"Zeigen";e.currentTarget.setAttribute("aria-pressed",on);pw.focus();
  });
  pw.addEventListener("input",()=>{msg.textContent="";pw.removeAttribute("aria-invalid")});
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!pw.value){msg.textContent="Bitte geben Sie das Passwort ein.";pw.focus();return}
    if(!window.crypto||!crypto.subtle){msg.textContent="Ihr Browser unterstützt die Entschlüsselung nicht. Bitte öffnen Sie die Seite über https in einem aktuellen Browser.";return}
    go.disabled=true;goT.textContent="Wird geöffnet …";
    try{await open(await derive(pw.value))}
    catch(err){
      go.disabled=false;goT.textContent="Portfolio öffnen";
      msg.textContent="Das Passwort stimmt nicht. Bitte prüfen Sie die Schreibweise und versuchen Sie es erneut.";
      pw.setAttribute("aria-invalid","true");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");pw.select();
    }
  });
  pw.focus();
})();
</script>
